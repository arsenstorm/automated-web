version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v4 calls chrome.* directly instead of the injected browser polyfill,
      # which breaks fake-browser-based tests. Revisit with a test migration.
      - dependency-name: "@webext-core/messaging"
        update-types: ["version-update:semver-major"]
    groups:
      wxt:
        patterns:
          - "wxt"
          - "@wxt-dev/*"
      dependencies:
        patterns: ["*"]
